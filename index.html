  if (loadedLibs[src]) return loadedLibs[src];
  loadedLibs[src] = new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = () => res(true);
    el.onerror = () => {
      delete loadedLibs[src];
      rej(new Error("函式庫載入失敗"));
    };
    document.head.appendChild(el);
  });

}

/* ── 照片壓縮 + 時間浮水印 ── */
function processPhoto(file, caption) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("讀取照片失敗"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("照片格式無法解析"));
      img.onload = () => {
        const MAX = 1080;
        let {
          width: w,
          height: h
        } = img;
        const s = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * s);
        h = Math.round(h * s);
        const cv = document.createElement("canvas");
        cv.width = w;
        cv.height = h;
        const cx = cv.getContext("2d");
        cx.drawImage(img, 0, 0, w, h);

        // 浮水印
        const fs = Math.max(14, Math.round(w / 32));
        cx.font = "bold " + fs + "px sans-serif";
        cx.textAlign = "right";
        cx.textBaseline = "bottom";
        cx.lineWidth = Math.max(2, fs / 6);
        cx.strokeStyle = "rgba(0,0,0,.75)";
        cx.fillStyle = "#fff";
        const lines = caption.split("\n");
        lines.forEach((ln, i) => {
          const y = h - 10 - (lines.length - 1 - i) * (fs * 1.25);
          cx.strokeText(ln, w - 12, y);
          cx.fillText(ln, w - 12, y);
        });

        // 自適應品質：一路降到 350KB 以下為止（雜訊多的照片才會用到後面幾段）
        const LIMIT = 350 * 1024;
        let url = "";
        for (const q of [0.72, 0.6, 0.5, 0.42, 0.35]) {
          url = cv.toDataURL("image/jpeg", q);
          if (url.length * 0.75 <= LIMIT) break;
        }
        res({
          base64: url.split(",")[1],
          preview: url,
          kb: Math.round(url.length * 0.75 / 1024)
        });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function App() {
  const [page, setPage] = useState("home");
  const [month, setMonth] = useState(monthKey(new Date()));
  const [data, setData] = useState(null);
  const [busy, setBusy] = useState(true);
  const [msg, setMsg] = useState("");
  const [user, setUser] = useState(LS.get("hz_user", ""));
  const [cur, setCur] = useState(null); // 目前開啟的客戶 id
  const [scan, setScan] = useState(false);
  const [pin, setPin] = useState(LS.get("hz_pin", ""));
  const [stale, setStale] = useState(0); // >0 表示畫面是快取資料
  const [prev, setPrev] = useState("home"); // 進清潔頁前停在哪一頁
  const [labelSel, setLabelSel] = useState([]); // 預先勾好的標籤客戶

  // 清單篩選
  const [fOwner, setFOwner] = useState("全部");
  const [fDist, setFDist] = useState("全部");
  const [fStat, setFStat] = useState("全部");
  const [fUrg, setFUrg] = useState("全部"); // 急迫度：逾期／今天／即將
  const [kw, setKw] = useState("");
  const toast = (t, ms = 2600) => {
    setMsg(t);
    setTimeout(() => setMsg(""), ms);
  };
  const load = useCallback(async (mk, opt = {}) => {
    // 先把快取畫出來，使用者不用等網路
    let hadCache = false;
    if (!opt.noCache) {
      const c = cacheGet(mk);
      if (c) {
        setData(c.data);
        setStale(c.at);
        hadCache = true;
      }
    }
    setBusy(true);
    try {
      const r = await fetch(API_URL + "?action=bootstrap&month=" + mk);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "讀取失敗");
      setData(j);
      setStale(0);
      cacheSet(mk, j);
    } catch (e) {
      if (hadCache) toast("目前離線，顯示的是上次同步的資料", 5000);else toast("連線失敗：" + e.message, 6000);
    }
    setBusy(false);
  }, []);
  useEffect(() => {
    load(month);
  }, [month, load]);
  const clients = data ? data.clients : [];
  const byId = useMemo(() => {
    const m = {};
    clients.forEach(c => m[c.id] = c);
    return m;
  }, [clients]);
  const owners = useMemo(() => {
    const s = new Set(clients.map(c => c.owner).filter(Boolean));
    return Array.from(s);
  }, [clients]);
  const dists = useMemo(() => {
    const s = new Set(clients.filter(c => fOwner === "全部" || c.owner === fOwner).map(c => c.dist).filter(Boolean));
    return Array.from(s).sort();
  }, [clients, fOwner]);

  /* ── 抄表週期 ── */
  const CYCLES = [{
    v: 1,
    t: "每月"
  }, {
    v: 2,
    t: "每 2 個月"
  }, {
    v: 3,
    t: "每季"
  }, {
    v: 6,
    t: "每半年"
  }, {
    v: 0,
    t: "不定期（不列入統計）"
  }];
  const cycText = v => (CYCLES.find(x => x.v === Number(v)) || CYCLES[0]).t;

  /* ── 抄表到期判斷 ──
     已退租、不定期 → 不列入
     本月已抄 → 算下一次（本月 + 週期）
     本月未抄 → 每月客戶算本月；長週期客戶算「上次抄表月 + 週期」 */
  const dueInfo = useCallback(c => {
    const lead = data?.config?.lead ?? 5;
    if (c.active === false) return {
      none: true,
      lead,
      inactive: true
    };
    const cyc = Number(c.cycle ?? 1);
    if (cyc === 0) return {
      none: true,
      lead,
      adhoc: true
    };
    const done = !!data?.meter?.[c.id];
    let day = c.day,
      src = "set";
    if (!day) {
      const ref = done ? data.meter[c.id] : data?.lastMeter?.[c.id];
      const d = ref && parseTS(ref.time);
      if (d) {
        day = d.getDate();
        src = "last";
      }
    }
    if (!day) return {
      none: true,
      lead,
      done
    };
    let yy, mm;
    const lm = data?.lastMeter?.[c.id];
    if (done) {
      [yy, mm] = month.split("-").map(Number);
      mm += cyc;
    } else if (cyc > 1 && lm) {
      [yy, mm] = lm.month.split("-").map(Number);
      mm += cyc;
    } else {
      [yy, mm] = month.split("-").map(Number);
    }
    while (mm > 12) {
      mm -= 12;
      yy += 1;
    }
    const eom = new Date(yy, mm, 0).getDate();
    const dd = Math.min(day, eom);
    const due = new Date(yy, mm - 1, dd);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.round((due - today) / 86400000);
    return {
      day: dd,
      mon: mm,
      src,
      due,
      diff,
      lead,
      done,
      cyc,
      state: diff < 0 ? "over" : diff === 0 ? "today" : diff <= lead ? "soon" : "later"
    };
  }, [data, month]);

  /* ── 單據：送單期限判斷 ── */
  const RTNS = ["技師繳回簽收聯", "客戶寄回回單", "技師收款後繳回", "不需繳回"];
  const billInfo = useCallback(c => {
    const lead = data?.config?.lead ?? 5;
    if (c.active === false) return {
      none: true,
      lead,
      inactive: true
    };
    const b = data?.bills?.[c.id];
    const noNeed = (c.rtn || "") === "不需繳回";

    // 狀態：未開單 → 已開單 → 已寄出 → 已繳回
    let st = "未開單";
    if (b) {
      if (b.back) st = "已繳回";else if (b.sent) st = "已寄出";else if (b.made) st = "已開單";
    }
    const done = st === "已繳回" || noNeed && st === "已寄出";
    const day = Number(c.bday || 0);
    if (!day) return {
      none: true,
      lead,
      st,
      done,
      b,
      noNeed
    };
    const [yy, mm] = month.split("-").map(Number);
    const eom = new Date(yy, mm, 0).getDate();
    const dd = Math.min(day, eom);
    const due = new Date(yy, mm - 1, dd);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.round((due - today) / 86400000);
    return {
      day: dd,
      mon: mm,
      due,
      diff,
      lead,
      st,
      done,
      b,
      noNeed,
      state: diff < 0 ? "over" : diff === 0 ? "today" : diff <= lead ? "soon" : "later"
    };
  }, [data, month]);

  /* 本月是否該抄（用來算進度分母） */
  const dueThisMonth = useCallback(c => {
    if (c.active === false) return false;
    const cyc = Number(c.cycle ?? 1);
    if (cyc === 0) return false;
    if (cyc === 1) return true;
    if (data?.meter?.[c.id]) return true;
    const lm = data?.lastMeter?.[c.id];
    if (!lm) return true;
    const [y1, m1] = lm.month.split("-").map(Number);
    const [y2, m2] = month.split("-").map(Number);
    return (y2 - y1) * 12 + (m2 - m1) >= cyc;
  }, [data, month]);

  /* 已進入提醒範圍的客戶（最急的排前面）。只在檢視當月時才有意義 */
  const dueList = useMemo(() => {
    if (!data || month !== monthKey(new Date())) return [];
    return clients.map(c => ({
      c,
      d: dueInfo(c)
    })).filter(x => !x.d.none && x.d.diff <= x.d.lead).sort((a, b) => a.d.diff - b.d.diff);
  }, [clients, data, dueInfo, month]);

  /* ── 冷卻判斷 ── */
  const coolInfo = useCallback(id => {
    const cool = data?.config?.cool ?? 3;
    const last = data?.lastClean?.[id];
    if (!last || !last.time) return {
      ok: true,
      never: true,
      cool
    };
    const ago = monthsAgo(last.time);
    if (ago >= cool) return {
      ok: true,
      last,
      ago,
      cool
    };
    return {
      ok: false,
      last,
      ago,
      cool,
      left: Math.max(1, Math.ceil(cool - ago))
    };
  }, [data]);

  /* ── 統計 ── */
  const stats = useMemo(() => {
    if (!data) return null;
    const goal = data.config?.goal ?? 20;
    const o = {};
    clients.forEach(c => {
      const k = c.owner || "未指定";
      o[k] = o[k] || {
        total: 0,
        done: 0,
        pass: 0,
        wait: 0,
        reject: 0,
        goal,
        off: 0,
        adhoc: 0
      };
      if (c.active === false) {

        return;
      }
      if (Number(c.cycle ?? 1) === 0) o[k].adhoc++;
      if (!dueThisMonth(c)) return;
      o[k].total++;
      if (data.meter[c.id]) o[k].done++;
    });
    clients.forEach(c => {
      if (c.active === false) return;
      const k = c.owner || "未指定";
      if (!o[k]) return;
      const cl = data.clean[c.id];
      if (cl) {
        if (cl.status === "已通過") o[k].pass++;else if (cl.status === "退回") o[k].reject++;else o[k].wait++;
      }
    });
    return o;
  }, [data, clients, dueThisMonth]);

  /* ── 篩選後清單 ── */
  const showUrg = fStat === "近期該抄" || fStat === "未抄表";
  const listedBase = useMemo(() => {
    const k = kw.trim();
    return clients.filter(c => {
      if (fStat === "已退租") {
        if (c.active !== false) return false;
      } else if (c.active === false) return false; // 預設不顯示已退租
      if (fOwner !== "全部" && c.owner !== fOwner) return false;
      if (fDist !== "全部" && c.dist !== fDist) return false;
      if (k && !(c.name.includes(k) || c.id.toUpperCase().includes(k.toUpperCase()))) return false;
      if (fStat === "近期該抄") {
        const d = dueInfo(c);
        if (d.none || d.diff > d.lead) return false;
      }
      if (fStat === "未抄表") {
        if (data?.meter[c.id]) return false;
        if (!dueThisMonth(c)) return false;
      }
      if (fStat === "已抄表" && !data?.meter[c.id]) return false;
      if (fStat === "可清潔" && !coolInfo(c.id).ok) return false;
      if (fStat === "本月已清潔" && !data?.clean[c.id]) return false;

      return true;
    });
  }, [clients, fOwner, fDist, fStat, kw, data, coolInfo, dueInfo, dueThisMonth]);

  /* 各急迫度的數量，直接顯示在按鈕上 */
  const urgCount = useMemo(() => {
    const o = {
      全部: listedBase.length,
      逾期: 0,

    };
