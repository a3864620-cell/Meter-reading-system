<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<title>華芝 抄表暨清潔系統</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#eef1f5;
       font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       color:#22303f;-webkit-text-size-adjust:100%}
  input,select,button,textarea{font-family:inherit}
  button{cursor:pointer;border:0}
  #root{max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  .sp{animation:sp 1s linear infinite}
  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    #root{max-width:none;padding:0}
    .lbl-sheet{display:block}
    .lbl{break-inside:avoid;page-break-inside:avoid}
    .lbl-page .lbl{page-break-after:always;break-after:page}
    .lbl-page .lbl:last-child{page-break-after:auto;break-after:auto}
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useCallback, useRef, useMemo} = React;

/* ══════════════════════════════════════════════════════════
   設定 — 部署完 Apps Script 後把網址貼進來
   ══════════════════════════════════════════════════════════ */
const API_URL = "https://script.google.com/macros/s/AKfycbxRUqopT1Thd2mpGDEyetnJKdSN-PzAGmuG-4PZrRiOg9J7FejZQcSV281CFAMV-wyxVw/exec";

/* ── 色盤 ── */
const C = {
  bg:"#eef1f5", navy:"#1b3a5c", accent:"#2f7d5d", light:"#ffffff",
  text:"#22303f", muted:"#7c8a99", danger:"#c0392b", success:"#2f7d5d",
  blue:"#2c6fa8", blueBg:"#eaf2fa", warn:"#c77f2a", warnBg:"#fdf4e6",
  line:"#dde3ea", grey:"#93a1b0"
};

/* ── 樣式積木 ── */
const btnS = (v="primary", ex={}) => {
  const base = {padding:"11px 16px", borderRadius:8, fontSize:15, fontWeight:600,
                color:"#fff", background:C.navy, lineHeight:1.2};
  const m = {primary:{background:C.navy}, accent:{background:C.accent},
             red:{background:C.danger}, warn:{background:C.warn},
             light:{background:"#fff", color:C.text, border:"1px solid "+C.line},
             ghost:{background:"transparent", color:C.blue, padding:"8px 4px"}};
  return {...base, ...(m[v]||{}), ...ex};
};
const inp = (ex={}) => ({padding:"10px 12px", borderRadius:8, border:"1px solid "+C.line,
                         fontSize:15, background:"#fff", color:C.text, width:"100%", ...ex});
const lbl = {fontSize:11, color:C.muted, letterSpacing:.5, marginBottom:4, display:"block"};
const card = (ex={}) => ({background:"#fff", borderRadius:10, padding:14,
                          border:"1px solid "+C.line, ...ex});

/* ── localStorage 安全包裝 ── */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* ── 日期工具 ── */
const pad = n => String(n).padStart(2,"0");
const monthKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
const parseTS = s => {
  if(!s) return null;
  const d = new Date(String(s).replace(/-/g,"/"));
  return isNaN(d) ? null : d;
};
const fmtShort = s => {
  const d = parseTS(s); if(!d) return "";
  return (d.getMonth()+1)+"/"+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
};
/** 相差幾個月（含小數，用天數換算） */
const monthsAgo = s => {
  const d = parseTS(s); if(!d) return 999;
  return (Date.now() - d.getTime()) / 86400000 / 30;
};

/* ── API ── */
async function api(action, body={}){
  const r = await fetch(API_URL, {method:"POST", body:JSON.stringify({action, ...body})});
  const t = await r.text();
  try { return JSON.parse(t); }
  catch(e){ return {ok:false, error:"回應格式錯誤："+t.slice(0,120)}; }
}

/* ── 照片壓縮 + 時間浮水印 ── */
function processPhoto(file, caption){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("讀取照片失敗"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("照片格式無法解析"));
      img.onload = () => {
        const MAX = 1080;
        let {width:w, height:h} = img;
        const s = Math.min(1, MAX/Math.max(w,h));
        w = Math.round(w*s); h = Math.round(h*s);

        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const cx = cv.getContext("2d");
        cx.drawImage(img, 0, 0, w, h);

        // 浮水印
        const fs = Math.max(14, Math.round(w/32));
        cx.font = "bold "+fs+"px sans-serif";
        cx.textAlign = "right"; cx.textBaseline = "bottom";
        cx.lineWidth = Math.max(2, fs/6);
        cx.strokeStyle = "rgba(0,0,0,.75)";
        cx.fillStyle = "#fff";
        const lines = caption.split("\n");
        lines.forEach((ln, i) => {
          const y = h - 10 - (lines.length-1-i)*(fs*1.25);
          cx.strokeText(ln, w-12, y);
          cx.fillText(ln, w-12, y);
        });

        // 自適應品質：一路降到 350KB 以下為止（雜訊多的照片才會用到後面幾段）
        const LIMIT = 350 * 1024;
        let url = "";
        for (const q of [0.72, 0.6, 0.5, 0.42, 0.35]){
          url = cv.toDataURL("image/jpeg", q);
          if (url.length * 0.75 <= LIMIT) break;
        }
        res({base64:url.split(",")[1], preview:url, kb:Math.round(url.length*0.75/1024)});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ── QR 向量圖 ── */
function QRSvg({text, size}){
  const d = useMemo(() => {
    if(!window.qrcode) return null;
    try{
      const q = window.qrcode(0, "M");
      q.addData(String(text));
      q.make();
      const n = q.getModuleCount();
      let path = "";
      for(let r = 0; r < n; r++)
        for(let c = 0; c < n; c++)
          if(q.isDark(r, c)) path += "M"+c+" "+r+"h1v1h-1z";
      return {n, path};
    }catch(e){ return null; }
  }, [text]);

  if(!d) return <div style={{width:size, height:size, background:"#eee"}}/>;
  return (
    <svg viewBox={"0 0 "+d.n+" "+d.n} width={size} height={size}
         shapeRendering="crispEdges" style={{display:"block"}}>
      <rect width={d.n} height={d.n} fill="#fff"/>
      <path d={d.path} fill="#000"/>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════════
   QR 掃描
   ══════════════════════════════════════════════════════════ */
function Scanner({onHit, onClose}){
  const vRef = useRef(null), cRef = useRef(null);
  const [err, setErr] = useState("");
  const stop = useRef(false);

  useEffect(() => {
    let stream, raf, det;
    stop.current = false;

    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:"environment"}}
        });
        const v = vRef.current;
        if(!v) return;
        v.srcObject = stream;
        v.setAttribute("playsinline","true");
        await v.play();

        if("BarcodeDetector" in window){
          try { det = new window.BarcodeDetector({formats:["qr_code"]}); } catch(e){ det = null; }
        }

        const tick = async () => {
          if(stop.current) return;
          if(v.readyState === v.HAVE_ENOUGH_DATA){
            let code = null;
            if(det){
              try {
                const r = await det.detect(v);
                if(r && r.length) code = r[0].rawValue;
              } catch(e){ det = null; }
            }
            if(!code && window.jsQR){
              const cv = cRef.current;
              cv.width = v.videoWidth; cv.height = v.videoHeight;
              const cx = cv.getContext("2d", {willReadFrequently:true});
              cx.drawImage(v, 0, 0, cv.width, cv.height);
              const d = cx.getImageData(0, 0, cv.width, cv.height);
              const q = window.jsQR(d.data, d.width, d.height);
              if(q) code = q.data;
            }
            if(code){
              stop.current = true;
              if(navigator.vibrate) navigator.vibrate(60);
              onHit(String(code).trim());
              return;
            }
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      } catch(e){
        setErr("無法開啟相機：" + e.message + "（請確認網址是 https 並允許相機權限）");
      }
    })();

    return () => {
      stop.current = true;
      if(raf) cancelAnimationFrame(raf);
      if(stream) stream.getTracks().forEach(t => t.stop());
    };
  }, [onHit]);

  return (
    <div style={{position:"fixed", inset:0, background:"#000", zIndex:90,
                 display:"flex", flexDirection:"column"}}>
      <div style={{padding:"12px 14px", color:"#fff", display:"flex",
                   justifyContent:"space-between", alignItems:"center"}}>
        <b style={{fontSize:16}}>掃描客戶 QR</b>
        <button onClick={onClose} style={btnS("light",{padding:"7px 14px"})}>關閉</button>
      </div>
      <div style={{flex:1, position:"relative", overflow:"hidden"}}>
        <video ref={vRef} style={{width:"100%", height:"100%", objectFit:"cover"}} muted/>
        <canvas ref={cRef} style={{display:"none"}}/>
        <div style={{position:"absolute", top:"50%", left:"50%",
                     transform:"translate(-50%,-50%)", width:"66%", aspectRatio:"1",
                     border:"3px solid rgba(255,255,255,.9)", borderRadius:16}}/>
      </div>
      <div style={{padding:14, color:"#fff", fontSize:13, textAlign:"center", minHeight:52}}>
        {err || "把服務編號的 QR 對準框內"}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   主程式
   ══════════════════════════════════════════════════════════ */
function App(){
  const [page, setPage]     = useState("home");
  const [month, setMonth]   = useState(monthKey(new Date()));
  const [data, setData]     = useState(null);
  const [busy, setBusy]     = useState(true);
  const [msg, setMsg]       = useState("");
  const [user, setUser]     = useState(LS.get("hz_user",""));
  const [cur, setCur]       = useState(null);      // 目前開啟的客戶 id
  const [scan, setScan]     = useState(false);
  const [pin, setPin]       = useState(LS.get("hz_pin",""));
  const [prev, setPrev]     = useState("home");   // 進清潔頁前停在哪一頁
  const [labelSel, setLabelSel] = useState([]);   // 預先勾好的標籤客戶

  // 清單篩選
  const [fOwner, setFOwner] = useState("全部");
  const [fDist, setFDist]   = useState("全部");
  const [fStat, setFStat]   = useState("全部");
  const [kw, setKw]         = useState("");

  const toast = (t, ms=2600) => { setMsg(t); setTimeout(() => setMsg(""), ms); };

  const load = useCallback(async (mk) => {
    setBusy(true);
    try {
      const r = await fetch(API_URL + "?action=bootstrap&month=" + mk);
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || "讀取失敗");
      setData(j);
    } catch(e){
      toast("連線失敗：" + e.message, 6000);
    }
    setBusy(false);
  }, []);

  useEffect(() => { load(month); }, [month, load]);

  const clients = data ? data.clients : [];
  const byId = useMemo(() => {
    const m = {}; clients.forEach(c => m[c.id] = c); return m;
  }, [clients]);

  const owners = useMemo(() => {
    const s = new Set(clients.map(c => c.owner).filter(Boolean));
    return Array.from(s);
  }, [clients]);

  const dists = useMemo(() => {
    const s = new Set(clients.filter(c => fOwner === "全部" || c.owner === fOwner)
                             .map(c => c.dist).filter(Boolean));
    return Array.from(s).sort();
  }, [clients, fOwner]);

  /* ── 抄表到期判斷 ──
     優先用客戶主檔設定的固定抄表日；沒有就用上個月實際抄表日推算 */
  const dueInfo = useCallback((c) => {
    const lead = data?.config?.lead ?? 5;
    let day = c.day, src = "set";
    if(!day){
      const lm = data?.lastMeter?.[c.id];
      const d = lm && parseTS(lm.time);
      if(d){ day = d.getDate(); src = "last"; }
    }
    if(!day) return {none:true, lead};

    const [yy, mm] = month.split("-").map(Number);
    const eom  = new Date(yy, mm, 0).getDate();      // 該月最後一天
    const dd   = Math.min(day, eom);                 // 31號遇到小月就縮到月底
    const due  = new Date(yy, mm-1, dd);

    const today = new Date(); today.setHours(0,0,0,0);
    const diff  = Math.round((due - today) / 86400000);

    return {day:dd, src, due, diff, lead,
            state: diff < 0 ? "over" : diff === 0 ? "today" : diff <= lead ? "soon" : "later"};
  }, [data, month]);

  /* 本月未抄、且已進入提醒範圍的客戶（最急的排前面） */
  const dueList = useMemo(() => {
    if(!data) return [];
    return clients
      .filter(c => !data.meter[c.id])
      .map(c => ({c, d:dueInfo(c)}))
      .filter(x => !x.d.none && x.d.diff <= (x.d.lead))
      .sort((a,b) => a.d.diff - b.d.diff);
  }, [clients, data, dueInfo]);

  /* ── 冷卻判斷 ── */
  const coolInfo = useCallback((id) => {
    const cool = data?.config?.cool ?? 3;
    const last = data?.lastClean?.[id];
    if(!last || !last.time) return {ok:true, never:true, cool};
    const ago = monthsAgo(last.time);
    if(ago >= cool) return {ok:true, last, ago, cool};
    return {ok:false, last, ago, cool, left:Math.max(1, Math.ceil(cool - ago))};
  }, [data]);

  /* ── 統計 ── */
  const stats = useMemo(() => {
    if(!data) return null;
    const goal = data.config?.goal ?? 20;
    const o = {};
    clients.forEach(c => {
      const k = c.owner || "未指定";
      o[k] = o[k] || {total:0, done:0, pass:0, wait:0, reject:0, goal};
      o[k].total++;
      if(data.meter[c.id]) o[k].done++;
      const cl = data.clean[c.id];
      if(cl){
        if(cl.status === "已通過") o[k].pass++;
        else if(cl.status === "退回") o[k].reject++;
        else o[k].wait++;
      }
    });
    return o;
  }, [data, clients]);

  /* ── 篩選後清單 ── */
  const listed = useMemo(() => {
    const k = kw.trim();
    return clients.filter(c => {
      if(fOwner !== "全部" && c.owner !== fOwner) return false;
      if(fDist  !== "全部" && c.dist  !== fDist)  return false;
      if(k && !(c.name.includes(k) || c.id.toUpperCase().includes(k.toUpperCase()))) return false;
      if(fStat === "近期該抄"){
        if(data?.meter[c.id]) return false;
        const d = dueInfo(c);
        if(d.none || d.diff > d.lead) return false;
      }
      if(fStat === "未抄表" && data?.meter[c.id]) return false;
      if(fStat === "已抄表" && !data?.meter[c.id]) return false;
      if(fStat === "可清潔" && !coolInfo(c.id).ok) return false;
      if(fStat === "本月已清潔" && !data?.clean[c.id]) return false;
      return true;
    });
  }, [clients, fOwner, fDist, fStat, kw, data, coolInfo, dueInfo]);

  /* ── 動作 ── */
  async function toggleMeter(c){
    const on = !data.meter[c.id];
    setBusy(true);
    const r = await api("meterToggle", {month, id:c.id, owner:c.owner, user, on});
    setBusy(false);
    if(!r.ok) return toast("失敗：" + r.error, 5000);
    setData(d => {
      const m = {...d.meter};
      if(on) m[c.id] = {time:r.time, by:user}; else delete m[c.id];
      return {...d, meter:m};
    });
    toast(on ? "已標記抄表 ✓" : "已取消抄表");
  }

  /* ── 版面積木 ── */
  const Head = ({title, back}) => (
    <div style={{background:C.navy, color:"#fff", padding:"14px 16px",
                 display:"flex", alignItems:"center", gap:10, position:"sticky",
                 top:0, zIndex:20}}>
      {back && <button onClick={back} style={btnS("light",{padding:"6px 12px", fontSize:14})}>←</button>}
      <b style={{fontSize:17}}>{title}</b>
      {busy && <span className="sp" style={{marginLeft:"auto", fontSize:15}}>◌</span>}
    </div>
  );

  const Bar = ({v, max, color}) => (
    <div style={{height:8, background:"#e6ebf1", borderRadius:99, overflow:"hidden"}}>
      <div style={{height:"100%", width:Math.min(100, max ? v/max*100 : 0)+"%",
                   background:color, borderRadius:99, transition:"width .3s"}}/>
    </div>
  );

  /* ── 到期徽章 ── */
  const dueText = d => d.none ? "" :
    d.state === "over"  ? "逾期 " + Math.abs(d.diff) + " 天" :
    d.state === "today" ? "今天到期" :
    "還有 " + d.diff + " 天";
  const dueColor = d =>
    d.state === "over" ? C.danger : d.state === "today" ? C.warn : C.blue;

  const DueBadge = ({d, small}) => d.none ? null : (
    <span style={{background:dueColor(d), color:"#fff", borderRadius:99,
                  padding:small ? "1px 7px" : "2px 10px",
                  fontSize:small ? 11 : 13, fontWeight:600, whiteSpace:"nowrap"}}>
      {d.day} 號 · {dueText(d)}
    </span>
  );

  /* ── 雲端照片（載入失敗時退回連結） ── */
  function Photo({id, link, w}){
    const [bad, setBad] = useState(false);
    if(bad) return (
      <a href={link || ("https://drive.google.com/file/d/"+id+"/view")}
         target="_blank" rel="noreferrer"
         style={{...card({background:C.blueBg, borderColor:"#c5daed",
                          display:"block", textAlign:"center"}),
                 color:C.blue, fontSize:14, textDecoration:"none"}}>
        照片無法直接預覽，點此在雲端硬碟開啟 ↗
      </a>
    );
    return (
      <img src={"https://drive.google.com/thumbnail?id="+id+"&sz=w"+w}
           alt="清潔照片" onError={() => setBad(true)}
           style={{width:"100%", borderRadius:8, border:"1px solid "+C.line,
                   background:"#f4f6f9"}}/>
    );
  }

  /* ══════ 客戶詳情 ══════ */
  function Detail({id}){
    const c = byId[id];
    if(!c) return (
      <div>
        <Head title="找不到客戶" back={() => setCur(null)}/>
        <div style={{padding:16}}>
          <div style={card()}>
            編號 <b>{id}</b> 不在客戶主檔中。<br/>
            <span style={{color:C.muted, fontSize:13}}>
              請確認 QR 是否為舊版，或這間客戶尚未建檔。
            </span>
          </div>
        </div>
      </div>
    );

    const m  = data.meter[c.id];
    const cl = data.clean[c.id];
    const ci = coolInfo(c.id);

    const stColor = {"已通過":C.success, "待審核":C.warn, "退回":C.danger}[cl?.status] || C.muted;

    return (
      <div>
        <Head title={c.id} back={() => setCur(null)}/>
        <div style={{padding:14, display:"grid", gap:12}}>

          <div style={card()}>
            <div style={{fontSize:22, fontWeight:700, marginBottom:6}}>{c.name}</div>
            <div style={{color:C.muted, fontSize:14}}>{c.owner}　·　{c.dist}</div>
            <div style={{display:"flex", gap:8, marginTop:12}}>
              <button onClick={() => setPage("editClient")}
                      style={btnS("light",{fontSize:13, padding:"8px 14px"})}>編輯資料</button>
              <button onClick={() => {setLabelSel([c.id]); setPage("labels");}}
                      style={btnS("light",{fontSize:13, padding:"8px 14px"})}>列印 QR 標籤</button>
            </div>
            {c.memo && (
              <div style={{marginTop:10, padding:"9px 11px", background:C.warnBg,
                           border:"1px solid #f0dcb8", borderRadius:8, fontSize:14,
                           lineHeight:1.6}}>
                {c.memo}
              </div>
            )}
          </div>

          {/* 抄表 */}
          <div style={card()}>
            <span style={lbl}>本月抄表　{month}</span>
            {m ? (
              <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:12}}>
                <span style={{fontSize:19, fontWeight:700, color:C.success}}>✓ 已抄表</span>
                <span style={{color:C.muted, fontSize:13}}>
                  {fmtShort(m.time)}{m.by ? "　"+m.by : ""}
                </span>
              </div>
            ) : (
              <div style={{fontSize:19, fontWeight:700, color:C.muted, marginBottom:8}}>
                尚未抄表
              </div>
            )}

            {(() => {
              const d = dueInfo(c);

  /* ══════ 清潔上傳 ══════ */
  function CleanUp({id}){
    const c = byId[id];
    const [ph, setPh]   = useState(null);
    const [up, setUp]   = useState(false);
    const [er, setEr]   = useState("");

    async function pick(e){
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      setEr("");
      try {
        const cap = c.name + "\n" + new Date().toLocaleString("zh-TW",{hour12:false});
        setPh(await processPhoto(f, cap));
      } catch(err){ setEr(err.message); }
    }

    async function send(){
      if(!ph) return;
      if(!user) return setEr("請先在首頁選擇操作人員");
      setUp(true); setEr("");
      const r = await api("cleanSubmit", {
        month, id:c.id, owner:c.owner, name:c.name,
        photo:ph.base64, mime:"image/jpeg"
      });
      setUp(false);
      if(!r.ok) return setEr(r.error);
      setData(d => ({...d, clean:{...d.clean,
        [c.id]:{time:r.time, photo:r.photo, link:r.link, status:"待審核", by:c.owner}}}));
      setPage(prev); setCur(c.id);
      toast("已送出，等待主管審核");
    }

    return (
      <div>
        <Head title="深度清潔申報" back={() => setPage(prev)}/>
        <div style={{padding:14, display:"grid", gap:12}}>
          <div style={card()}>
            <div style={{fontSize:19, fontWeight:700}}>{c.name}</div>
            <div style={{color:C.muted, fontSize:13, marginTop:4}}>
              {c.id}　·　{c.dist}　·　{c.owner}
            </div>
          </div>

          <div style={card()}>
            <span style={lbl}>清潔後照片（機器內部保養）</span>
            <div style={{fontSize:13, color:C.muted, lineHeight:1.7, marginBottom:12}}>
              請拍攝<b>清潔完成後的機器內部</b>，需看得出實際保養部位。
              照片會自動壓上客戶名稱與拍攝時間。
            </div>

            {ph ? (
              <div>
                <img src={ph.preview} alt="預覽"
                     style={{width:"100%", borderRadius:8, border:"1px solid "+C.line}}/>
                <div style={{fontSize:12, color:C.muted, margin:"8px 0"}}>
                  壓縮後約 {ph.kb} KB
                </div>
                <label style={{...btnS("light"), display:"block", textAlign:"center"}}>
                  重新拍照
                  <input type="file" accept="image/*" capture="environment"
                         onChange={pick} style={{display:"none"}}/>
                </label>
              </div>
            ) : (
              <label style={{...btnS("primary",{padding:"36px 16px", fontSize:17}),
                             display:"block", textAlign:"center"}}>
                📷　開啟相機拍照
                <input type="file" accept="image/*" capture="environment"
                       onChange={pick} style={{display:"none"}}/>
              </label>
            )}
          </div>

          {er && (
            <div style={{...card({background:"#fdecea", borderColor:"#f5c6c0"}),
                         color:C.danger, fontSize:14}}>{er}</div>
          )}

          <button onClick={send} disabled={!ph || up}
                  style={btnS("accent",{width:"100%", padding:"16px", fontSize:17,
                                        opacity:(!ph||up)?.45:1})}>
            {up ? "上傳中…" : "送出申報"}
          </button>
        </div>
      </div>
    );
  }

  /* ══════ 主管審核 ══════ */
  function Review(){
    const [p, setP]     = useState(pin);
    const [ok, setOk]   = useState(!!pin);
    const [why, setWhy] = useState({});
    const [work, setWork] = useState("");

    const pend = clients
      .filter(c => data.clean[c.id] && data.clean[c.id].status === "待審核")
      .sort((a,b) => (data.clean[a.id].time > data.clean[b.id].time ? 1 : -1));

    async function judge(c, pass){
      setWork(c.id);
      const r = await api("review", {
        month, id:c.id, pin:p, result:pass ? "pass" : "reject",
        reason: pass ? "" : (why[c.id]||""), reviewer:"主管"
      });
      setWork("");
      if(!r.ok) return toast("失敗：" + r.error, 5000);
      LS.set("hz_pin", p); setPin(p);
      setData(d => ({...d, clean:{...d.clean,
        [c.id]:{...d.clean[c.id], status:r.status}}}));
      toast(pass ? "已通過 ✓" : "已退回");
    }

    if(!ok) return (
      <div>
        <Head title="主管審核" back={() => setPage("home")}/>
        <div style={{padding:16}}>
          <div style={card()}>
            <span style={lbl}>請輸入主管密碼</span>
            <input type="password" value={p} onChange={e => setP(e.target.value)}
                   style={inp({marginBottom:12})} inputMode="numeric"/>
            <button onClick={() => setOk(!!p)} style={btnS("primary",{width:"100%"})}>
              進入
            </button>
          </div>
        </div>
      </div>
    );

    return (
      <div>
        <Head title={"待審核　"+pend.length+" 件"} back={() => setPage("home")}/>
        <div style={{padding:14, display:"grid", gap:12}}>
          {pend.length === 0 && (
            <div style={{...card(), textAlign:"center", color:C.muted, padding:30}}>
              目前沒有待審核的清潔紀錄
            </div>
          )}
          {pend.map(c => {
            const cl = data.clean[c.id];
            return (
              <div key={c.id} style={card()}>
                <div style={{fontSize:18, fontWeight:700}}>{c.name}</div>
                <div style={{color:C.muted, fontSize:13, margin:"4px 0 10px"}}>
                  {c.id}　·　{c.dist}　·　{c.owner}　·　{fmtShort(cl.time)}
                </div>
                <Photo id={cl.photo} link={cl.link} w={800}/>
                <a href={cl.link} target="_blank" rel="noreferrer"
                   style={{...btnS("ghost"), display:"inline-block", fontSize:13}}>
                  開啟原始照片 ↗
                </a>
                <input placeholder="退回原因（退回時必填）"
                       value={why[c.id]||""}
                       onChange={e => setWhy(w => ({...w, [c.id]:e.target.value}))}
                       style={inp({margin:"8px 0 10px"})}/>
                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
                  <button disabled={work===c.id} onClick={() => judge(c, true)}
                          style={btnS("accent",{padding:"14px"})}>通過</button>
                  <button disabled={work===c.id || !(why[c.id]||"").trim()}
                          onClick={() => judge(c, false)}
                          style={btnS("red",{padding:"14px",
                            opacity:(why[c.id]||"").trim()?1:.4})}>退回</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  /* ══════ QR 標籤列印 ══════ */
  function Labels(){
    const [w, setW]     = useState(Number(LS.get("hz_lw", 35)));
    const [h, setH]     = useState(Number(LS.get("hz_lh", 25)));
    const [mode, setMode] = useState(LS.get("hz_lmode", "page"));  // page=標籤機 / a4=A4貼紙
    const [showName, setShowName] = useState(LS.get("hz_lname","1") === "1");
    const [sel, setSel] = useState(() => new Set(labelSel));
    const [lo, setLo]   = useState("全部");
    const [ld, setLd]   = useState("全部");
    const [lk, setLk]   = useState("");

    const pool = clients.filter(c => {
      if(lo !== "全部" && c.owner !== lo) return false;
      if(ld !== "全部" && c.dist  !== ld) return false;
      const k = lk.trim();
      if(k && !(c.name.includes(k) || c.id.toUpperCase().includes(k.toUpperCase()))) return false;
      return true;
    });
    const poolDists = Array.from(new Set(
      clients.filter(c => lo === "全部" || c.owner === lo).map(c => c.dist).filter(Boolean))).sort();

    const flip = id => setSel(s => {
      const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n;
    });
    const picked = clients.filter(c => sel.has(c.id));

    // 版面：寬扁 → QR 左、文字右；接近正方 → QR 上、文字下
    const pad  = Math.max(0.8, Math.min(w, h) * 0.06);
    const side = w >= h * 1.25;
    const qr   = side ? (h - pad*2) : Math.min(w - pad*2, h * 0.62);
    const fId  = Math.max(1.8, (side ? h : h - qr) * 0.24);
    const fNm  = fId * 0.82;

    function doPrint(){
      LS.set("hz_lw", w); LS.set("hz_lh", h);
      LS.set("hz_lmode", mode); LS.set("hz_lname", showName ? "1" : "0");
      const old = document.getElementById("pagerule");
      if(old) old.remove();
      const st = document.createElement("style");
      st.id = "pagerule";
      st.textContent = mode === "page"
        ? "@media print{@page{size:" + w + "mm " + h + "mm;margin:0}}"
        : "@media print{@page{size:A4;margin:8mm}}";
      document.head.appendChild(st);
      setTimeout(() => window.print(), 120);
    }

    const Label = ({c}) => (
      <div className="lbl" style={{
            width:w+"mm", height:h+"mm", padding:pad+"mm", boxSizing:"border-box",
            display:"flex", flexDirection:side ? "row" : "column",
            alignItems:"center", justifyContent:side ? "flex-start" : "center",
            gap:pad+"mm", overflow:"hidden", background:"#fff",
            border:mode === "a4" ? "0.2mm dashed #bbb" : "0"}}>
        <QRSvg text={c.id} size={qr+"mm"}/>
        <div style={{minWidth:0, flex:1, textAlign:side ? "left" : "center",
                     lineHeight:1.15, overflow:"hidden"}}>
          <div style={{fontSize:fId+"mm", fontWeight:700, letterSpacing:"-0.02em",
                       whiteSpace:"nowrap"}}>{c.id}</div>
          {showName && (
            <div style={{fontSize:fNm+"mm", marginTop:pad*0.4+"mm",
                         display:"-webkit-box", WebkitLineClamp:2,
                         WebkitBoxOrient:"vertical", overflow:"hidden",
                         wordBreak:"break-all"}}>{c.name}</div>
          )}
        </div>
      </div>
    );

    return (
      <div>
        <div className="noprint">
          <Head title={"QR 標籤　已選 "+sel.size+" 張"} back={() => setPage("home")}/>
        </div>

        <div className="noprint" style={{padding:14, display:"grid", gap:12}}>
          <div style={card()}>
            <span style={lbl}>標籤尺寸（mm）</span>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12}}>
              <div>
                <span style={{...lbl, marginBottom:2}}>寬度</span>
                <input type="number" value={w} min={15} max={210} step={1}
                       onChange={e => setW(Math.max(10, Number(e.target.value)||10))}
                       style={inp()} inputMode="decimal"/>
              </div>
              <div>
                <span style={{...lbl, marginBottom:2}}>高度</span>
                <input type="number" value={h} min={10} max={297} step={1}
                       onChange={e => setH(Math.max(10, Number(e.target.value)||10))}
                       style={inp()} inputMode="decimal"/>
              </div>
            </div>
            <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:12}}>
              {[[35,25],[40,30],[50,30],[30,20],[70,38]].map(([a,b]) => (
                <button key={a+"x"+b} onClick={() => {setW(a); setH(b);}}
                        style={btnS(w===a&&h===b ? "primary" : "light",
                                    {padding:"6px 10px", fontSize:12})}>
                  {a}×{b}
                </button>
              ))}
            </div>

            <span style={lbl}>輸出方式</span>
            <select value={mode} onChange={e => setMode(e.target.value)} style={inp({marginBottom:12})}>
              <option value="page">標籤機（一張標籤一頁）</option>
              <option value="a4">A4 貼紙（整頁排版，虛線為裁切線）</option>
            </select>

            <label style={{display:"flex", alignItems:"center", gap:8, fontSize:14}}>
              <input type="checkbox" checked={showName}
                     onChange={e => setShowName(e.target.checked)}
                     style={{width:18, height:18}}/>
              標籤上顯示客戶名稱
            </label>
          </div>

          <div style={card()}>
            <span style={lbl}>挑選客戶</span>
            <input placeholder="搜尋客戶名稱或編號" value={lk}
                   onChange={e => setLk(e.target.value)} style={inp({marginBottom:8})}/>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:10}}>
              <select value={lo} onChange={e => {setLo(e.target.value); setLd("全部");}}
                      style={inp({fontSize:13, padding:"8px"})}>
                <option>全部</option>
                {owners.map(o => <option key={o}>{o}</option>)}
              </select>
              <select value={ld} onChange={e => setLd(e.target.value)}
                      style={inp({fontSize:13, padding:"8px"})}>
                <option>全部</option>
                {poolDists.map(d => <option key={d}>{d}</option>)}
              </select>
            </div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10}}>
              <button onClick={() => setSel(s => {
                        const n = new Set(s); pool.forEach(c => n.add(c.id)); return n;})}
                      style={btnS("light",{fontSize:13})}>
                全選這 {pool.length} 間
              </button>
              <button onClick={() => setSel(new Set())} style={btnS("light",{fontSize:13})}>
                清空選取
              </button>
            </div>

            <div style={{maxHeight:300, overflowY:"auto", border:"1px solid "+C.line,
                         borderRadius:8}}>
              {pool.map(c => (
                <label key={c.id}
                       style={{display:"flex", alignItems:"center", gap:10,
                               padding:"9px 11px", borderBottom:"1px solid "+C.line,
                               fontSize:14, cursor:"pointer",
                               background:sel.has(c.id) ? C.blueBg : "#fff"}}>
                  <input type="checkbox" checked={sel.has(c.id)}
                         onChange={() => flip(c.id)} style={{width:18, height:18}}/>
                  <span style={{fontFamily:"monospace", fontSize:12, color:C.muted}}>{c.id}</span>
                  <span style={{whiteSpace:"nowrap", overflow:"hidden",
                                textOverflow:"ellipsis"}}>{c.name}</span>
                </label>
              ))}
              {pool.length === 0 &&
                <div style={{padding:20, textAlign:"center", color:C.muted}}>沒有符合的客戶</div>}
            </div>
          </div>

          <button onClick={doPrint} disabled={sel.size === 0}
                  style={btnS("primary",{width:"100%", padding:"16px", fontSize:17,
                                         opacity:sel.size ? 1 : .4})}>
            列印 {sel.size} 張標籤
          </button>

          <div style={{...card({background:C.blueBg, borderColor:"#c5daed"}),
                       fontSize:13, lineHeight:1.8}}>
            列印對話框裡請把<b>邊界設為「無」</b>、<b>縮放設為 100%</b>，
            並取消勾選頁首頁尾，尺寸才會準。QR 內容就是服務編號本身，
            跟你 Excel 裡的公式產生的完全一樣，舊標籤不用換。
          </div>

          {picked.length > 0 && (
            <div>
              <span style={lbl}>預覽（實際列印尺寸）</span>
              <div style={{background:"#fff", padding:10, borderRadius:8,
                           border:"1px solid "+C.line, display:"flex",
                           flexWrap:"wrap", gap:6, overflowX:"auto"}}>
                {picked.slice(0,6).map(c => (
                  <div key={c.id} style={{border:"1px dashed "+C.line}}>
                    <Label c={c}/>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* 實際送印的內容 */}
        <div className={"lbl-sheet " + (mode === "page" ? "lbl-page" : "")}
             style={{display:"none"}}>
          {picked.map(c => <Label key={c.id} c={c}/>)}
        </div>
      </div>
    );
  }

  /* ══════ 新增 / 編輯客戶 ══════ */
  function ClientForm({editId}){
    const src = editId ? byId[editId] : null;
    const [f, setF] = useState(src ? {...src} :
      {id:"", owner:(user && user !== "其他") ? user : (owners[0] || ""),
       dist:"", name:"", memo:"", day:""});
    const [w, setW]   = useState(false);
    const [er, setEr] = useState("");

    // 依負責人推算下一個可用編號
    const suggest = useCallback((owner) => {
      const pre = owner === "李哲倫" ? "HZ-L-" : owner === "林冠廷" ? "HZ-T-" : "";
      if(!pre) return "";
      const used = clients.filter(c => c.id.indexOf(pre) === 0)
                          .map(c => parseInt(c.id.slice(pre.length), 10))
                          .filter(n => !isNaN(n));
      const next = used.length ? Math.max.apply(null, used) + 1 : 1;
      return pre + String(next).padStart(3, "0");
    }, [clients]);

    useEffect(() => {
      if(!editId && !f.id) setF(x => ({...x, id:suggest(x.owner)}));
    }, [editId, f.owner, f.id, suggest]);

    async function save(){
      const id = f.id.trim().toUpperCase();
      if(!id)        return setEr("請填服務編號");
      if(!f.name.trim()) return setEr("請填客戶名稱");
      if(!editId && byId[id]) return setEr("編號 " + id + " 已存在（" + byId[id].name + "）");
      setW(true); setEr("");
      const r = await api("saveClient", {client:{
        id, owner:f.owner.trim(), dist:f.dist.trim(),
        name:f.name.trim(), memo:f.memo.trim(), day:f.day || ""},
        oldId:editId || ""});
      setW(false);
      if(!r.ok) return setEr(r.error);
      await load(month);
      if(editId){ setPage("home"); setCur(id); toast("已更新客戶資料"); }
      else { setLabelSel([id]); setPage("labels"); toast("已新增 " + id + "，可直接列印標籤"); }
    }

    const freeDists = Array.from(new Set(clients.map(c => c.dist).filter(Boolean))).sort();

    return (
      <div>
        <Head title={editId ? "編輯客戶" : "新增客戶"}
              back={() => {setPage(editId ? "home" : "home"); if(!editId) setCur(null);}}/>
        <div style={{padding:14, display:"grid", gap:12}}>
          <div style={card()}>
            <span style={lbl}>負責人</span>
            <select value={f.owner}
                    onChange={e => setF({...f, owner:e.target.value,
                                         id:editId ? f.id : suggest(e.target.value)})}
                    style={inp({marginBottom:12})}>
              {owners.map(o => <option key={o}>{o}</option>)}
            </select>

            <span style={lbl}>服務編號（QR 內容就是這一串）</span>
            <input value={f.id} onChange={e => setF({...f, id:e.target.value})}
                   style={inp({marginBottom:4, fontFamily:"monospace"})}
                   placeholder="HZ-L-118"/>
            <div style={{fontSize:12, color:C.muted, marginBottom:12}}>
              系統已自動帶入下一個空號，可自行修改
            </div>

            <span style={lbl}>客戶名稱</span>
            <input value={f.name} onChange={e => setF({...f, name:e.target.value})}
                   style={inp({marginBottom:12})} placeholder="例：永慶1F"/>

            <span style={lbl}>區域</span>
            <input value={f.dist} onChange={e => setF({...f, dist:e.target.value})}
                   list="distlist" style={inp({marginBottom:12})} placeholder="例：三民區"/>
            <datalist id="distlist">
              {freeDists.map(d => <option key={d} value={d}/>)}
            </datalist>

            <span style={lbl}>固定抄表日（每月幾號，可留空）</span>
            <input type="number" min={1} max={31} value={f.day || ""}
                   onChange={e => setF({...f, day:e.target.value})}
                   style={inp({marginBottom:4})} inputMode="numeric"
                   placeholder="例：25"/>
            <div style={{fontSize:12, color:C.muted, marginBottom:12, lineHeight:1.7}}>
              有約定日期才填。留空的話系統會用上個月實際抄表日推算，
              一樣會提前 {data.config?.lead ?? 5} 天提醒。
            </div>

            <span style={lbl}>備註</span>
            <textarea value={f.memo} onChange={e => setF({...f, memo:e.target.value})}
                      rows={3} style={inp({resize:"vertical"})}
                      placeholder="例：送帳單(收款)、25號"/>
          </div>

          {er && (
            <div style={{...card({background:"#fdecea", borderColor:"#f5c6c0"}),
                         color:C.danger, fontSize:14}}>{er}</div>
          )}

          <button onClick={save} disabled={w}
                  style={btnS("accent",{width:"100%", padding:"16px", fontSize:17})}>
            {w ? "儲存中…" : (editId ? "儲存變更" : "新增並產生標籤")}
          </button>
        </div>
      </div>
    );
  }

  /* ══════ 客戶清單 ══════ */
  function List(){
    return (
      <div>
        <Head title={"客戶清單　"+listed.length+" 間"} back={() => setPage("home")}/>
        <div style={{padding:"12px 14px", background:"#fff",
                     borderBottom:"1px solid "+C.line, position:"sticky", top:52, zIndex:15}}>
          <input placeholder="搜尋客戶名稱或編號" value={kw}
                 onChange={e => setKw(e.target.value)} style={inp({marginBottom:8})}/>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6}}>
            <select value={fOwner} onChange={e => {setFOwner(e.target.value); setFDist("全部");}}
                    style={inp({fontSize:13, padding:"8px"})}>
              <option>全部</option>
              {owners.map(o => <option key={o}>{o}</option>)}
            </select>
            <select value={fDist} onChange={e => setFDist(e.target.value)}
                    style={inp({fontSize:13, padding:"8px"})}>
              <option>全部</option>
              {dists.map(d => <option key={d}>{d}</option>)}
            </select>
            <select value={fStat} onChange={e => setFStat(e.target.value)}
                    style={inp({fontSize:13, padding:"8px"})}>
              <option>全部</option>
              <option>近期該抄</option>
              <option>未抄表</option>
              <option>已抄表</option>
              <option>可清潔</option>
              <option>本月已清潔</option>
            </select>
          </div>
        </div>

        <div style={{padding:"10px 14px 30px", display:"grid", gap:8}}>
          {listed.map(c => {
            const m = data.meter[c.id], cl = data.clean[c.id], ci = coolInfo(c.id);
            return (
              <div key={c.id} onClick={() => setCur(c.id)}
                   style={{...card({padding:"11px 13px", cursor:"pointer",
                          borderLeft:"4px solid "+(m ? C.success : C.line)})}}>
                <div style={{display:"flex", justifyContent:"space-between", gap:10}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:16, fontWeight:600, whiteSpace:"nowrap",
                                 overflow:"hidden", textOverflow:"ellipsis"}}>
                      {c.name}
                    </div>
                    <div style={{fontSize:12, color:C.muted, marginTop:3}}>
                      {c.id}　·　{c.dist}
                    </div>
                  </div>
                  <div style={{textAlign:"right", flexShrink:0, fontSize:12}}>
                    <div style={{color:m ? C.success : C.grey, fontWeight:600}}>
                      {m ? "已抄表" : "未抄表"}
                    </div>
                    {!m && (() => { const d = dueInfo(c);
                      return (!d.none && d.diff <= d.lead)
                        ? <div style={{marginTop:3}}><DueBadge d={d} small/></div> : null;
                    })()}
                    <div style={{marginTop:3, color:cl ? C.blue : (ci.ok ? C.accent : C.grey)}}>
                      {cl ? "清潔·"+cl.status : (ci.ok ? "可清潔" : "冷卻中")}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
          {listed.length === 0 && (
            <div style={{textAlign:"center", color:C.muted, padding:30}}>沒有符合的客戶</div>
          )}
        </div>
      </div>
    );
  }

  /* ══════ 首頁 ══════ */
  function Home(){
    const monthOpts = [];
    for(let i = 0; i < 12; i++){
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      monthOpts.push(monthKey(d));
    }
    const totalUnread = clients.filter(c => !data.meter[c.id]).length;

    return (
      <div>
        <div style={{background:C.navy, color:"#fff", padding:"16px 16px 20px"}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <b style={{fontSize:18}}>華芝　抄表暨清潔</b>
            {busy && <span className="sp">◌</span>}
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:14}}>
            <select value={month} onChange={e => setMonth(e.target.value)}
                    style={inp({padding:"9px", fontSize:14})}>
              {monthOpts.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
            <select value={user} onChange={e => {setUser(e.target.value); LS.set("hz_user", e.target.value);}}
                    style={inp({padding:"9px", fontSize:14})}>
              <option value="">選擇操作人員</option>
              {owners.map(o => <option key={o}>{o}</option>)}
              <option>其他</option>
            </select>
          </div>
        </div>

        <div style={{padding:14, display:"grid", gap:12, marginTop:-8}}>

          <button onClick={() => setScan(true)}
                  style={btnS("accent",{padding:"20px", fontSize:19, borderRadius:12,
                                        boxShadow:"0 3px 10px rgba(47,125,93,.3)"})}>
            掃描 QR 開始作業
          </button>

          {/* 近期該抄表 */}
          {dueList.length > 0 && (() => {
            const over = dueList.filter(x => x.d.state === "over").length;
            return (
              <div style={card({borderLeft:"4px solid "+(over ? C.danger : C.warn)})}>
                <div style={{display:"flex", justifyContent:"space-between",
                             alignItems:"baseline", marginBottom:10}}>
                  <b style={{fontSize:16}}>近期該抄表</b>
                  <span style={{fontSize:13, color:C.muted}}>
                    {dueList.length} 間
                    {over > 0 && <b style={{color:C.danger, marginLeft:6}}>逾期 {over}</b>}
                  </span>
                </div>

                {dueList.slice(0, 5).map(({c, d}) => (
                  <div key={c.id} onClick={() => setCur(c.id)}
                       style={{display:"flex", justifyContent:"space-between",
                               alignItems:"center", gap:10, padding:"8px 0",
                               borderBottom:"1px solid "+C.line, cursor:"pointer"}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:15, fontWeight:600, whiteSpace:"nowrap",
                                   overflow:"hidden", textOverflow:"ellipsis"}}>
                        {c.name}
                      </div>
                      <div style={{fontSize:11, color:C.muted, marginTop:2}}>
                        {c.dist}　·　{c.owner}
                        {d.src === "last" && <span style={{marginLeft:4}}>（依上月推算）</span>}
                      </div>
                    </div>
                    <DueBadge d={d} small/>
                  </div>
                ))}

                <button onClick={() => {setFStat("近期該抄"); setFOwner("全部");
                                        setFDist("全部"); setKw(""); setPage("list");}}
                        style={btnS("light",{width:"100%", marginTop:10, fontSize:14})}>
                  {dueList.length > 5 ? "查看全部 " + dueList.length + " 間" : "開啟完整清單"}
                </button>
              </div>
            );
          })()}

          {/* 抄表進度 */}
          <div style={card()}>
            <div style={{display:"flex", justifyContent:"space-between",
                         alignItems:"baseline", marginBottom:12}}>
              <b style={{fontSize:16}}>本月抄表進度</b>
              <span onClick={() => {setFStat("未抄表"); setFOwner("全部");
                                    setFDist("全部"); setKw(""); setPage("list");}}
                    style={{color:C.danger, fontWeight:700, fontSize:15, cursor:"pointer"}}>
                還有 {totalUnread} 間未抄 ›
              </span>
            </div>
            {stats && Object.keys(stats).map(k => {
              const s = stats[k];
              return (
                <div key={k} style={{marginBottom:12}}>
                  <div style={{display:"flex", justifyContent:"space-between",
                               fontSize:14, marginBottom:5}}>
                    <span>{k}</span>
                    <span style={{color:C.muted}}>
                      <b style={{color:C.text, fontSize:16}}>{s.done}</b> / {s.total}
                      <span style={{color:C.danger, marginLeft:8}}>未抄 {s.total-s.done}</span>
                    </span>
                  </div>
                  <Bar v={s.done} max={s.total} color={C.success}/>
                </div>
              );
            })}
          </div>

          {/* 清潔進度 */}
          <div style={card()}>
            <div style={{display:"flex", justifyContent:"space-between",
                         alignItems:"baseline", marginBottom:12}}>
              <b style={{fontSize:16}}>本月深度清潔</b>
              <span style={{fontSize:12, color:C.muted}}>
                每組目標 {data.config?.goal ?? 20} 間
              </span>
            </div>
            {stats && Object.keys(stats).map(k => {
              const s = stats[k];
              return (
                <div key={k} style={{marginBottom:12}}>
                  <div style={{display:"flex", justifyContent:"space-between",
                               fontSize:14, marginBottom:5}}>
                    <span>{k}</span>
                    <span style={{color:C.muted}}>
                      通過 <b style={{color:C.success, fontSize:16}}>{s.pass}</b> / {s.goal}
                      {s.wait > 0 && <span style={{color:C.warn, marginLeft:8}}>待審 {s.wait}</span>}
                      {s.reject > 0 && <span style={{color:C.danger, marginLeft:8}}>退回 {s.reject}</span>}
                    </span>
                  </div>
                  <Bar v={s.pass} max={s.goal} color={C.blue}/>
                </div>
              );
            })}
            <button onClick={() => {setFStat("可清潔"); setFOwner(user && user!=="其他" ? user : "全部");
                                    setFDist("全部"); setKw(""); setPage("list");}}
                    style={btnS("light",{width:"100%", marginTop:4})}>
              查看可清潔名單（滿 {data.config?.cool ?? 3} 個月）
            </button>
          </div>

          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
            <button onClick={() => {setLabelSel([]); setPage("labels");}}
                    style={btnS("light",{padding:"14px"})}>QR 標籤列印</button>
            <button onClick={() => {setCur(null); setPage("addClient");}}
                    style={btnS("light",{padding:"14px"})}>新增客戶</button>
          </div>

          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
            <button onClick={() => {setFStat("全部"); setPage("list");}}
                    style={btnS("light",{padding:"14px"})}>客戶清單</button>
            <button onClick={() => setPage("review")}
                    style={btnS("light",{padding:"14px"})}>
              主管審核
              {stats && Object.values(stats).reduce((a,s)=>a+s.wait,0) > 0 &&
                <span style={{marginLeft:6, background:C.warn, color:"#fff",
                              borderRadius:99, padding:"1px 7px", fontSize:12}}>
                  {Object.values(stats).reduce((a,s)=>a+s.wait,0)}
                </span>}
            </button>
          </div>

          <button onClick={() => setPage("admin")}
                  style={{...btnS("ghost"), fontSize:13, color:C.muted}}>
            月結重置
          </button>
        </div>
      </div>
    );
  }

  /* ══════ 渲染分流 ══════ */
  if(API_URL.indexOf("script.google.com") < 0) return (
    <div style={{padding:24}}>
      <div style={{...card(), lineHeight:1.9}}>
        <b style={{fontSize:17}}>尚未設定 API 網址</b><br/>
        請打開這個 HTML 檔，把最上方的 <code>API_URL</code> 換成你的
        Apps Script 網頁應用程式網址（結尾是 <code>/exec</code>）。
      </div>
    </div>
  );

  if(!data) return (
    <div style={{padding:40, textAlign:"center", color:C.muted}}>
      <div className="sp" style={{fontSize:30, marginBottom:12}}>◌</div>
      讀取中…
      {msg && <div style={{marginTop:16, color:C.danger, fontSize:14}}>{msg}</div>}
    </div>
  );

  let body;
  if(page === "clean" && cur)   body = <CleanUp id={cur}/>;
  else if(page === "review")    body = <Review/>;
  else if(page === "admin")     body = <Admin/>;
  else if(page === "labels")    body = <Labels/>;
  else if(page === "addClient") body = <ClientForm editId={null}/>;
  else if(page === "editClient")body = <ClientForm editId={cur}/>;
  else if(cur)                  body = <Detail id={cur}/>;   // 詳情蓋在清單之上
  else if(page === "list")      body = <List/>;
  else                          body = <Home/>;

  return (
    <div>
      {body}
      {scan && <Scanner onClose={() => setScan(false)}
                        onHit={code => {setScan(false); setCur(code); setPage("home");}}/>}
      {msg && (
        <div style={{position:"fixed", left:"50%", bottom:24, transform:"translateX(-50%)",
                     background:"rgba(24,34,45,.95)", color:"#fff", padding:"12px 20px",
                     borderRadius:10, fontSize:14, zIndex:99, maxWidth:"90vw",
                     textAlign:"center", lineHeight:1.5, pointerEvents:"none"}}>
          {msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
